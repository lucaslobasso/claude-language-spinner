name: Bug report
description: The spinner shows the wrong thing, or a pack doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw and what you expected. For a pack problem, include the output of `/spinner test NAME`.
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: Output of /spinner
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version and Claude Code version
      placeholder: "language-spinner 0.4.0, Claude Code 2.1.325"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and terminal
